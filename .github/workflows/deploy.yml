name: Build and Deploy

on:
  push:
    branches:
      - main
      
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      # - name: Build the app
      #   run: yarn nx run surviving-mars-stats:build:production

      - name: Build & Deploy with angular-cli-ghpages 🚀
        run: yarn nx run surviving-mars-stats:deploy

